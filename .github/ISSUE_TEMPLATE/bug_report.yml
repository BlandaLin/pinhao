name: Bug Report / 问题反馈
description: 报告报错、漏字、排版或制作问题 / Report errors, missing text, layout, or production problems.
body:
  - type: markdown
    attributes:
      value: |
        请描述出错前的操作，并附相关截图或日志片段。发出前遮盖密钥、账号和个人目录，不要上传完整游戏或私人工程。
        Describe the steps leading to the problem and attach relevant screenshots or log excerpts. Redact keys, accounts, and personal paths. Keep full games and private projects out of public reports.
  - type: input
    id: version
    attributes:
      label: Software Version / 软件版本
      description: 注明中英文版及 Windows 版本 / Include the Chinese or English edition and your Windows version.
      placeholder: '0.5.8 English edition, Windows 11 x64'
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Game and Engine / 游戏与引擎
      description: 填写游戏名称与版本，引擎不确定可留空 / Give the game title and version; leave the engine blank if unknown.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction / 复现步骤
      placeholder: 从哪一步出错？预期是什么，实际发生了什么？ / What steps led to the problem? What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and Logs / 截图与日志
      description: 附错误提示；漏字请指出对白或菜单位置 / Include the error message. For missing text, identify the dialogue or menu.
